name: Checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm test
      - run: node --check server.js && node --check public/app.js && node --check public/qr.js
      - run: bash -n install.sh && bash -n kuobox.sh
      - run: command -v shellcheck >/dev/null || sudo apt-get install -y -qq shellcheck
      - run: shellcheck -S warning install.sh kuobox.sh
